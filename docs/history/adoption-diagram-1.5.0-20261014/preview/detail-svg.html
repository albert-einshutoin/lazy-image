<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guide diagram: svg</title><style>body{margin:0;background:white;color:#172034;font:16px Arial,sans-serif}main{max-width:1008px;box-sizing:border-box;padding:24px;margin:auto}h1{font-size:20px;margin:0 0 12px}img{display:block;width:100%;max-width:960px;height:auto}pre{white-space:pre-wrap;font-size:12px}details{margin-top:16px}.ruler{position:fixed;top:0;left:0;width:100px;height:24px;background:#000;z-index:9999;pointer-events:none}.pan{overflow:auto;max-height:calc(100vh - 220px);border:1px solid #94a3b8}.pan img{width:960px;max-width:none}</style><div class="ruler" aria-hidden="true"></div><main><h1>Original SVG: 960 CSS px</h1><p><a href="svg.html">Normal display</a> · <a href="picture.html">Responsive raster example</a></p><p><button type="button" data-width="960">Original size</button> <button type="button" data-width="1920">2×</button> <button type="button" data-area="verification">Verification</button> <button type="button" data-area="failure">Failure</button> <button type="button" data-pan="-1">Left</button> <button type="button" data-pan="1">Right</button></p><div class="pan" role="region" aria-label="Scrollable enlarged diagram" tabindex="0"><img data-image-id="svg" src="compiler-artifact-flow.svg" width="960" height="1400" alt="Compiler flow: input, compileImage, private staging, local commit, images and manifest, application delivery. Failure does not commit unverified artifacts."></div><details><summary>Observation</summary><pre id="qa-observation">loading</pre></details></main><script src="qa.js"></script><script>for(const button of document.querySelectorAll("button[data-width]"))button.addEventListener("click",()=>{document.querySelector(".pan img").style.width=button.dataset.width+"px";document.querySelector("h1").textContent="Original SVG: "+button.dataset.width+" CSS px";});for(const button of document.querySelectorAll("button[data-area]"))button.addEventListener("click",()=>{const pan=document.querySelector(".pan"),scale=document.querySelector(".pan img").getBoundingClientRect().width/960;pan.scrollTo({left:0,top:(button.dataset.area==="verification"?472:1208)*scale});});for(const button of document.querySelectorAll("button[data-pan]"))button.addEventListener("click",()=>{const pan=document.querySelector(".pan");pan.scrollBy({left:Number(button.dataset.pan)*pan.clientWidth*0.8});});</script></html>

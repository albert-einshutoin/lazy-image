<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>compileImage static build</title>
<style>
  body { margin: 0; color: #18232d; background: #f4f6f8; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 32px auto; padding: 24px; }
  img { display: block; max-width: 100%; height: auto; border-radius: 12px; }
</style>
<main>
  <h1>compileImage static build</h1>
  <p>Actual widths: 320 px. No upscaling.</p>
  <picture>
    <source type="image/webp" srcset="images/image-320.webp 320w" sizes="(max-width: 368px) calc(100vw - 48px), 320px">
    <img src="images/image-320.jpg" srcset="images/image-320.jpg 320w" sizes="(max-width: 368px) calc(100vw - 48px), 320px" width="320" height="320" alt="Compiled example image">
  </picture>
  <p><a href="images/manifest.json">Compiler manifest</a></p>
</main>
</html>

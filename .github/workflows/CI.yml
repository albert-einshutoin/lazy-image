name: CI

env:
  DEBUG: napi:*
  APP_NAME: lazy-image
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  schedule:
    - cron: '17 18 * * *' # 03:17 JST; avoid the top-of-hour runner spike.
  workflow_dispatch:  # Allow manual trigger
    inputs:
      full_validation:
        description: 'Run the complete validation suite'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Skip npm publish and GitHub Release creation/update'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS
          - host: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
            build: npm run build -- --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            build: npm run build -- --target aarch64-apple-darwin
          
          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc
          
          # Linux (glibc)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu

          # Linux (glibc, ARM64)
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu
          
          # Linux (musl)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            build: |
              sudo apt-get update
              sudo apt-get install -y musl-tools
              npm run build -- --target x86_64-unknown-linux-musl

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.settings.target }}

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: build-${{ matrix.settings.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          rm -f -- ./*.node
          ${{ matrix.settings.build }}
        shell: bash

      - name: Require exactly the target binary
        shell: bash
        run: |
          files=( ./*.node )
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "./lazy-image.${{ matrix.settings.platform }}.node"

      # Node 22 on Linux x64 is the canonical generator environment for the
      # committed NAPI loader and declarations. Other matrix entries verify
      # platform builds without redefining the reviewed public artifacts.
      - name: Verify committed NAPI artifacts are reproducible
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        run: npm run check:generated-artifacts

      - name: Verify package after canonical generation
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        run: npm pack --dry-run

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "lazy-image.${{ matrix.settings.platform }}.node"
          if-no-files-found: error

  test-rust:
    name: Rust Tests
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Run Rust tests (without NAPI features)
        run: cargo test --no-default-features --no-fail-fast

      - name: Run Rust tests (release mode, without NAPI features)
        run: cargo test --no-default-features --release

      - name: Setup Node.js for selector contract validation
        if: matrix.host == 'ubuntu-latest'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22

      - name: Validate configured Rust test selectors
        if: matrix.host == 'ubuntu-latest'
        run: npm run test:ci-planner:rust-targets

      # Note: NAPI tests require Node.js runtime and cannot be run with cargo test alone.
      # NAPI functionality is tested via JavaScript integration tests in the 'test' job.
      # The napi_tests.rs file exists for local development with Node.js installed.

  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      # Default features are the shipping Rust surface: NAPI bindings, jemalloc
      # where supported, and AVIF support. Gate it separately from lean builds.
      - name: Run Clippy (default features)
        run: cargo clippy -- -D warnings

      - name: Run Clippy (without default features)
        run: cargo clippy --no-default-features -- -D warnings

      # The `stress` feature (example: stress_test) is not built by the default
      # or no-default clippy/test jobs, so type changes can break it invisibly.
      - name: Check stress feature compiles
        run: cargo clippy --no-default-features --features stress -- -D warnings

  package-contract:
    name: Package Contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify npm pack contract
        run: npm run test:pack-contract

      - name: Verify Wasm workspace pack contract
        run: npm --workspace @alberteinshutoin/lazy-image-wasm pack --dry-run

      - name: Run Wasm workspace tests
        run: npm run test:wasm:package

  test:
    name: Test (Node ${{ matrix.node }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            artifact: bindings-x86_64-unknown-linux-gnu
          - host: macos-14
            artifact: bindings-aarch64-apple-darwin
          - host: windows-latest
            artifact: bindings-x86_64-pc-windows-msvc
        node: [22, 24]

    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.settings.artifact }}
          path: .

      - name: Create test image
        run: node test/helpers/create-test-image.js

      - name: Test
        run: npm run test:js

  quality:
    name: Quality Regression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Install dependencies
        run: npm ci

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .

      - name: Run golden quality suite (SSIM/PSNR)
        run: node test/integration/golden.test.js

      - name: Run quality metrics smoke
        run: node test/integration/quality-metrics.test.js

      - name: Run benchmark verification (size/quality guards)
        run: npm run test:bench:verify

      - name: Run extended benchmark suite (AVIF/memory/cold-start)
        run: npm run test:bench:extended

  perf-safety:
    name: Perf Safety Gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Install dependencies
        run: npm ci

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .

      - name: Run perf + memory regression gate
        run: npm run test:bench:perf-safety-gate

      - name: Run edge-case safety suite (OOM/bounds)
        run: node test/integration/edge-cases.test.js

  supply-chain:
    name: Supply Chain
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Download all binding artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true

      - name: Generate SBOMs
        run: |
          cargo metadata --format-version 1 --locked > sbom-cargo.json
          npm ls --all --json > sbom-npm.json

      - name: Hash compiled bindings
        run: |
          find artifacts -name "*.node" -type f -print -exec sha256sum {} \; > binding-hashes.sha256

      - name: Upload supply-chain reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: supply-chain-reports
          path: |
            sbom-cargo.json
            sbom-npm.json
            binding-hashes.sha256

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@617b2c1f0f6355a96a120720d1c14499d0e12814 # cargo-llvm-cov

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage
        run: cargo llvm-cov --no-default-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  leak-detection:
    name: Memory Leak Detection (ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust (nightly, pinned for cache stability)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: nightly-2026-03-25

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install npm dependencies
        run: npm ci

      # Cache Cargo dependencies to speed up builds
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: "v5-asan"
          cache-on-failure: true

      # Build with ASan instrumentation (separate step for progress visibility)
      - name: Build with AddressSanitizer
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-03-25
          # --target: prevents RUSTFLAGS from being applied to build scripts
          # and proc macros (napi-derive, cc, etc.), avoiding unnecessary
          # ASan instrumentation on compile-time code.
          # -Zthreads=8: enables parallel rustc front-end (~30% faster).
          # -C link-arg=-fuse-ld=lld: faster linker than default ld.
          # -C debuginfo=1: line-tables-only (matches profile, avoids RUSTFLAGS override)
          RUSTFLAGS: "-Zsanitizer=address -Zthreads=8 -C link-arg=-fuse-ld=lld -C link-args=-Wl,-z,nodelete -C debuginfo=1"
          CARGO_INCREMENTAL: "0"
        run: |
          echo "::group::cargo build (ASan-instrumented)"
          cargo build --target x86_64-unknown-linux-gnu \
            --profile ci-asan \
            --no-default-features --features napi \
            --timings 2>&1
          echo "::endgroup::"

      - name: Generate NAPI bindings
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-03-25
          RUSTFLAGS: "-Zsanitizer=address -Zthreads=8 -C link-arg=-fuse-ld=lld -C link-args=-Wl,-z,nodelete -C debuginfo=1"
          CARGO_INCREMENTAL: "0"
        run: |
          npx napi build --platform --target x86_64-unknown-linux-gnu --profile ci-asan --no-default-features --features napi
          # Restore committed index.js/index.d.ts — napi build may overwrite
          # them with stubs when type-def generation is skipped (ci-asan profile).
          # The stress test only needs the .node binary; postbuild-fixup patches
          # (extra helpers, stricter types) are not required here.
          git checkout -- index.js index.d.ts

      - name: Run NAPI-boundary stress test
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:symbolize=1"
          LSAN_OPTIONS: "suppressions=lsan.suppressions"
          RUST_BACKTRACE: 1
          NODE_OPTIONS: "--max-old-space-size=8192"
          DISABLE_V8_COMPILE_CACHE: 1
        run: |
          ASAN_RT=""
          if command -v clang >/dev/null 2>&1; then
            CLANG_RT_DIR="$(clang --print-runtime-dir 2>/dev/null || true)"
            if [ -n "$CLANG_RT_DIR" ]; then
              ASAN_RT="$(find "$CLANG_RT_DIR" -name 'libclang_rt.asan-x86_64*.so' | head -n 1)"
            fi
          fi
          if [ -z "$ASAN_RT" ]; then
            ASAN_RT="$(find /usr/lib/llvm-* -path '*/lib/linux/libclang_rt.asan-x86_64*.so' | head -n 1)"
          fi
          if [ -z "$ASAN_RT" ]; then
            echo "Failed to locate ASan runtime"
            exit 1
          fi
          export LD_PRELOAD="$ASAN_RT${LD_PRELOAD:+:$LD_PRELOAD}"
          mkdir -p artifacts/reliability
          npm run test:stress:napi -- \
            --iterations 10 \
            --malformed-rounds 10 \
            --target-bytes-rounds 5 \
            --rss-growth-limit-mb 1536 \
            --summary-json artifacts/reliability/napi-boundary-stress.json \
            --summary-md artifacts/reliability/napi-boundary-stress.md

      - name: Add NAPI stress summary
        if: always()
        run: |
          if [ -f artifacts/reliability/napi-boundary-stress.md ]; then
            cat artifacts/reliability/napi-boundary-stress.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload NAPI stress artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: napi-boundary-stress
          path: artifacts/reliability/napi-boundary-stress.*
          if-no-files-found: ignore

  candidate-pack:
    name: Stage release candidate tarballs
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - name: Download only native bindings from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bindings-*
          path: artifacts
      - name: Verify binary identity and pack release candidate
        run: node scripts/stage-release-artifacts.cjs artifacts candidate
      - name: Upload exact release candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error

  candidate-smoke:
    name: Candidate ${{ matrix.platform }} / Node ${{ matrix.node }}
    needs: candidate-pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-14, node: '22' }
          - { platform: darwin-arm64, runner: macos-14, node: '24' }
          - { platform: darwin-x64, runner: macos-15-intel, node: '22' }
          - { platform: darwin-x64, runner: macos-15-intel, node: '24' }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04, node: '22' }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04, node: '24' }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm, node: '22' }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm, node: '24' }
          - { platform: linux-x64-musl, runner: ubuntu-24.04, node: '22' }
          - { platform: linux-x64-musl, runner: ubuntu-24.04, node: '24' }
          - { platform: win32-x64-msvc, runner: windows-2022, node: '22' }
          - { platform: win32-x64-msvc, runner: windows-2022, node: '24' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SMOKE_SCRIPT_REVISION: ${{ github.sha }}
      SMOKE_HOST_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: candidate
      - name: Read candidate version
        shell: bash
        run: echo "SMOKE_VERSION=$(node -p "require('./candidate/manifest.json').version")" >> "$GITHUB_ENV"
      - name: Setup Node.js
        if: matrix.platform != 'linux-x64-musl'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke candidate on native runner
        if: matrix.platform != 'linux-x64-musl'
        shell: bash
        env:
          SMOKE_EXPECTED_PLATFORM: ${{ matrix.platform }}
          SMOKE_CANDIDATE_DIR: ${{ github.workspace }}/candidate
          SMOKE_REPORT_PATH: ${{ runner.temp }}/lazy-image-candidate-smoke.json
          SMOKE_HOST_OS: ${{ runner.os }}
          SMOKE_HOST_ARCH: ${{ runner.arch }}
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/lazy-image-smoke-started"
          node scripts/registry-native-smoke.cjs 2>&1 | tee "$RUNNER_TEMP/lazy-image-candidate-smoke.log"
      - name: Smoke candidate in Alpine musl container
        if: matrix.platform == 'linux-x64-musl'
        shell: bash
        env:
          SMOKE_HOST_OS: ${{ runner.os }}
          SMOKE_HOST_ARCH: ${{ runner.arch }}
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP:/result" \
            -e SMOKE_EXPECTED_PLATFORM=linux-x64-musl \
            -e SMOKE_CANDIDATE_DIR=/source/candidate \
            -e SMOKE_REPORT_PATH=/result/lazy-image-candidate-smoke.json \
            -e SMOKE_VERSION -e SMOKE_SCRIPT_REVISION -e SMOKE_HOST_RUNNER -e SMOKE_HOST_OS -e SMOKE_HOST_ARCH -e GITHUB_SHA \
            "node:${{ matrix.node }}-alpine" \
            sh -c 'touch /result/lazy-image-smoke-started; node /source/scripts/registry-native-smoke.cjs' \
            2>&1 | tee "$RUNNER_TEMP/lazy-image-candidate-smoke.log"
      - name: Preserve setup failure as a result
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/lazy-image-candidate-smoke.json" ]; then
            if [ -f "$RUNNER_TEMP/lazy-image-smoke-started" ]; then
              state=FAIL
              reason='Smoke process failed before writing its report; inspect job log'
            else
              state=BLOCKED
              reason='Runner setup or container startup failed before smoke execution; inspect job log'
            fi
            printf '{"status":"%s","expectedPlatform":"%s","nodeMajor":"%s","scriptRevision":"%s","reason":"%s"}\n' \
              "$state" '${{ matrix.platform }}' '${{ matrix.node }}' '${{ github.sha }}' "$reason" \
              > "$RUNNER_TEMP/lazy-image-candidate-smoke.json"
            printf '%s\n' "$reason" >> "$RUNNER_TEMP/lazy-image-candidate-smoke.log"
          fi
      - name: Preserve report and execution log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: candidate-smoke-${{ matrix.platform }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/lazy-image-candidate-smoke.json
            ${{ runner.temp }}/lazy-image-candidate-smoke.log
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - candidate-smoke
      - rust-quality
      - package-contract
      - test-rust
      - test
      - quality
      - perf-safety
      - supply-chain
      - coverage
      - leak-detection
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@alberteinshutoin'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag matches package version
        run: node scripts/check-release-policy.js "$(node -p "require('./package.json').version")" "$GITHUB_REF_NAME"
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: candidate
      - name: Publish candidate platform tarballs
        run: node scripts/publish-release-candidate.cjs candidate platform
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Wasm package
        run: |
          pkg_name="@alberteinshutoin/lazy-image-wasm"
          pkg_version="$(node -p "require('./packages/lazy-image-wasm/package.json').version")"

          if npm view "$pkg_name@$pkg_version" version >/dev/null 2>&1; then
            echo "$pkg_name@$pkg_version already exists; skipping publish."
            exit 0
          fi

          npm publish \
            --workspace "$pkg_name" \
            --access public \
            --provenance \
            --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish verified main tarball
        run: node scripts/publish-release-candidate.cjs candidate main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -p "require('./package.json').version")"
          awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 { capture=1; next } capture && index($0, "## [") == 1 { exit } capture { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating flags..."
            gh release edit "$TAG" --draft=false --prerelease=false --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

name: Benchmark Regression

on:
  workflow_dispatch:
    inputs:
      matched_diagnostic:
        description: "Run the bounded same-job A/B diagnostic for #913 instead of the historical comparison"
        required: false
        default: false
        type: boolean
      fail_on_regression:
        description: "Fail workflow when regression threshold is exceeded"
        required: false
        default: false
        type: boolean
      speed_threshold_pct:
        description: "Speed regression threshold (%)"
        required: false
        default: "15"
        type: string
      size_threshold_pct:
        description: "Size regression threshold (%)"
        required: false
        default: "5"
        type: string
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 03:00 UTC

permissions:
  contents: read

env:
  APP_NAME: lazy-image
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  benchmark:
    name: Benchmark Regression
    if: github.event_name != 'workflow_dispatch' || !inputs.matched_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu

      - name: Setup NASM
        uses: ./.github/actions/setup-nasm

      - name: Install dependencies
        run: npm ci

      - name: Build native binding (Linux)
        run: npm run build -- --target x86_64-unknown-linux-gnu

      - name: Run benchmark baseline suite (JSON output)
        env:
          BENCHMARK_OUTPUT_JSON: artifacts/benchmark/sharp-comparison.json
          BENCHMARK_QUALITY_OUTPUT_JSON: artifacts/benchmark/sharp-comparison-quality.json
        run: |
          mkdir -p artifacts/benchmark
          npm run test:bench:compare

      - name: Record compiler and constrained-quality release evidence
        run: npm run test:bench:release

      - name: Run extended benchmark suite (#405)
        run: |
          npm run test:bench:extended | tee artifacts/benchmark/extended.log

      - name: Run zero-copy measurement
        run: |
          node --expose-gc docs/scripts/measure-zero-copy.js > artifacts/benchmark/zero-copy.json

      - name: Compare benchmark result against baseline
        env:
          FAIL_ON_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_regression || 'false' }}
          SPEED_THRESHOLD: ${{ github.event_name == 'workflow_dispatch' && inputs.speed_threshold_pct || '15' }}
          SIZE_THRESHOLD: ${{ github.event_name == 'workflow_dispatch' && inputs.size_threshold_pct || '5' }}
        run: |
          MODE="warn"
          if [ "$FAIL_ON_REGRESSION" = "true" ]; then MODE="fail"; fi

          node scripts/bench/check-regression.js \
            --baseline .github/benchmarks/baseline.json \
            --current artifacts/benchmark/sharp-comparison.json \
            --output artifacts/benchmark/regression-summary.md \
            --json-output artifacts/benchmark/regression-summary.json \
            --mode "$MODE" \
            --speed-threshold "$SPEED_THRESHOLD" \
            --size-threshold "$SIZE_THRESHOLD"

      - name: Publish summary
        run: cat artifacts/benchmark/regression-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        # Quality gates intentionally fail after writing diagnostics; always
        # retain those files so a failed run remains actionable.
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-regression
          path: artifacts/benchmark
          if-no-files-found: error

  paired:
    name: Matched Benchmark Diagnostic (#913)
    if: github.event_name == 'workflow_dispatch' && inputs.matched_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: benchmark-paired-${{ github.ref }}
      cancel-in-progress: true
    env:
      UV_THREADPOOL_SIZE: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0
      - uses: ./.github/actions/setup-nasm
      - name: Prepare two immutable revisions and record environment
        run: |
          MATCHED_AREA="$RUNNER_TEMP/lazy-image-paired-913"
          printf 'MATCHED_AREA=%s\n' "$MATCHED_AREA" >> "$GITHUB_ENV"
          mkdir "$MATCHED_AREA"
          git fetch --no-tags origin a0db8d7f2471c037c10dc2cdd521f2098ea4edae
          git worktree add --detach "$MATCHED_AREA/a" a0db8d7f2471c037c10dc2cdd521f2098ea4edae
          git worktree add --detach "$MATCHED_AREA/b" "$GITHUB_SHA"
          {
            node --version
            npm --version
            rustc -Vv
            cc --version
            lscpu
            uname -a
            df -h
            cat /etc/os-release
          } > "$MATCHED_AREA/environment.log"
      - name: Build each revision separately using canonical commands
        run: |
          for side in a b; do
            (
              cd "$MATCHED_AREA/$side"
              npm ci
              CARGO_TARGET_DIR="$MATCHED_AREA/targets/$side" npm run build
            ) > "$MATCHED_AREA/$side-build.log" 2>&1
          done
      - name: Run prespecified sequential AB/BA comparison
        run: |
          npm run test:bench:paired -- \
            --base "$MATCHED_AREA/a" \
            --candidate "$MATCHED_AREA/b" \
            --output "$MATCHED_AREA/results"
      - name: Retain every sample and failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: paired-benchmark-913
          path: |
            ${{ runner.temp }}/lazy-image-paired-913/results
            ${{ runner.temp }}/lazy-image-paired-913/*.log
          if-no-files-found: error
          retention-days: 90

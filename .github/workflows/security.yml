name: Security Audit

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜0時
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      
      - name: Run security audit
        run: node scripts/cargo-audit-policy.js
      
      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { upsertSecurityAuditIssue } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/security-audit-notification.js`
            );
            const result = await upsertSecurityAuditIssue({ github, context });
            core.info(`Security audit notification: ${result.action} issue #${result.issueNumber}`);

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Audit published runtime dependencies
        timeout-minutes: 20
        run: node scripts/npm-audit-policy.js --omit=dev --audit-level=high

      # Development-only codec oracles process repository-owned fixtures and
      # are not shipped to consumers. Critical advisories still fail here;
      # high runtime advisories remain blocking in the published graph above.
      - name: Audit development dependencies for critical issues
        timeout-minutes: 20
        run: node scripts/npm-audit-policy.js --audit-level=critical

name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜0時
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      
      - name: Run security audit
        run: >
          cargo audit --deny unmaintained --deny unsound
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0097
          --ignore RUSTSEC-2026-0105
        # Ignore RUSTSEC-2024-0436 (paste unmaintained) - indirect dependency via rav1e, not a security risk
        # Ignore RUSTSEC-2026-0097 (rand unsound custom logger path) - indirect via rav1e/proptest; lazy-image does not use rand::rng() logging hooks
        # Ignore RUSTSEC-2026-0105 (core2 unmaintained) - indirect via image -> ravif -> rav1e; no patched upstream path is available yet
        # cargo-audit cannot ignore yanked crates by advisory ID, so yanked warnings remain non-fatal until core2 leaves the upstream tree
      
      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { upsertSecurityAuditIssue } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/security-audit-notification.js`
            );
            const result = await upsertSecurityAuditIssue({ github, context });
            core.info(`Security audit notification: ${result.action} issue #${result.issueNumber}`);

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=high
